<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>VÂN LÔ RẦN — Chiến Trường 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fps-styles.css">
</head>
<body>

  <!-- HUD overlay -->
  <div id="hud">
    <div id="hud-top">
      <div id="hud-name">---</div>
      <div id="hud-kill-feed"></div>
    </div>
    <div id="hud-bottom">
      <div id="hud-hp-block">
        <div id="hud-hp-label">MÁU</div>
        <div id="hud-hp-bar-wrap"><div id="hud-hp-bar"></div></div>
        <div id="hud-hp-num">100</div>
      </div>
      <div id="hud-weapon-block">
        <span id="hud-weapon-icon">🔫</span>
        <span id="hud-weapon-name">SÚNG</span>
      </div>
      <div id="hud-ammo-block">
        <span id="hud-ammo-icon">⬡</span>
        <span id="hud-ammo-num">∞</span>
      </div>
    </div>
    <!-- Crosshair -->
    <div id="crosshair">
      <div class="ch-line ch-top"></div>
      <div class="ch-line ch-bot"></div>
      <div class="ch-line ch-left"></div>
      <div class="ch-line ch-right"></div>
      <div class="ch-dot"></div>
    </div>
    <!-- Damage flash -->
    <div id="damage-flash"></div>
    <!-- Death screen -->
    <div id="death-screen" class="hidden">
      <div id="death-text">ĐÃ CHẾT</div>
      <div id="death-sub">Đang hồi sinh...</div>
    </div>
    <!-- Kill banner -->
    <div id="kill-banner" class="hidden"></div>
    <!-- Weapon model overlay (canvas rendered on top) -->
    <canvas id="weapon-canvas"></canvas>
  </div>

  <!-- Canvas for Three.js -->
  <canvas id="game-canvas"></canvas>

  <!-- Mobile Controls -->
  <div id="mobile-controls">
    <!-- Joystick left -->
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-knob"></div>
      </div>
    </div>
    <!-- Right side buttons -->
    <div id="right-buttons">
      <button id="btn-fire" class="mob-btn fire-btn">🔥</button>
      <button id="btn-jump" class="mob-btn jump-btn">↑</button>
      <button id="btn-weapon" class="mob-btn weapon-btn">⚔</button>
    </div>
    <!-- Look zone (right side drag) -->
    <div id="look-zone"></div>
  </div>

  <!-- Login overlay -->
  <div id="login-overlay">
    <div id="login-box">
      <div id="login-title">VÂN LÔ<span>RẦN</span></div>
      <div id="login-sub">Chiến Trường 3D · Nhiều Người Chơi</div>
      <div id="login-form">
        <input id="player-name-input" type="text" maxlength="10" placeholder="TÊN CHIẾN SĨ (tối đa 10 ký tự)" autocomplete="off" />
        <button id="login-btn">VÀO CHIẾN TRƯỜNG</button>
      </div>
      <div id="login-controls">
        WASD · Di chuyển &nbsp;|&nbsp; Chuột · Nhìn &amp; Bắn &nbsp;|&nbsp; 1/2 · Chuyển vũ khí
        <br>Phím Cách · Nhảy &nbsp;|&nbsp; Click canvas để khóa chuột
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  </script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="fps-app.js"></script>
</body>
</html>
