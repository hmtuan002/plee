<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>VVSS FPS — Multiplayer 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fps-styles.css">
</head>
<body>

  <!-- HUD overlay -->
  <div id="hud">
    <div id="hud-top">
      <div id="hud-name">---</div>
      <div id="hud-kill-feed"></div>
    </div>
    <div id="hud-bottom">
      <div id="hud-hp-block">
        <div id="hud-hp-label">HP</div>
        <div id="hud-hp-bar-wrap"><div id="hud-hp-bar"></div></div>
        <div id="hud-hp-num">100</div>
      </div>
      <div id="hud-coins-block">
        <span id="hud-coins-icon">◈</span>
        <span id="hud-coins-num">0</span>
      </div>
      <div id="hud-ammo-block">
        <span id="hud-ammo-icon">⬡</span>
        <span id="hud-ammo-num">∞</span>
      </div>
    </div>
    <!-- Crosshair -->
    <div id="crosshair">
      <div class="ch-line ch-top"></div>
      <div class="ch-line ch-bot"></div>
      <div class="ch-line ch-left"></div>
      <div class="ch-line ch-right"></div>
      <div class="ch-dot"></div>
    </div>
    <!-- Damage flash -->
    <div id="damage-flash"></div>
    <!-- Death screen -->
    <div id="death-screen" class="hidden">
      <div id="death-text">YOU DIED</div>
      <div id="death-sub">Respawning...</div>
    </div>
    <!-- Kill banner -->
    <div id="kill-banner" class="hidden"></div>
  </div>

  <!-- Player sprites (enemies rendered in world) -->
  <div id="sprites-layer"></div>

  <!-- Canvas for raycasting -->
  <canvas id="game-canvas"></canvas>

  <!-- Login overlay -->
  <div id="login-overlay">
    <div id="login-box">
      <div id="login-title">VVSS<span>FPS</span></div>
      <div id="login-sub">Multiplayer · Raycasting · Firebase</div>
      <div id="login-form">
        <input id="player-name-input" type="text" maxlength="10" placeholder="TÊN LÍNH (tối đa 10 ký tự)" autocomplete="off" />
        <button id="login-btn">VÀO CHIẾN TRƯỜNG</button>
      </div>
      <div id="login-controls">
        WASD · Di chuyển &nbsp;|&nbsp; Chuột · Nhìn &amp; Bắn &nbsp;|&nbsp; Click vào canvas để khóa chuột
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAq52d5zrc5rN6UFflwb22bJD9GSjdS0ts",
      authDomain: "vvss-b7a49.firebaseapp.com",
      databaseURL: "https://vvss-b7a49-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "vvss-b7a49",

    };
    firebase.initializeApp(firebaseConfig);
  </script>
  <script src="fps-app.js"></script>
</body>
</html>
